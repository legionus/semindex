name: CMake on a single platform
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential time cmake python3 pkg-config sqlite3 libsqlite3-dev \
          clang-22 llvm-22-dev libclang-22-dev libclang-cpp22-dev \
          clang-format-22

    - name: Configure CMake
      run: >-
        cmake -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DLLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm
        -DClang_DIR=/usr/lib/llvm-22/lib/cmake/clang
        -DCLANG_FORMAT=/usr/bin/clang-format-22

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure
